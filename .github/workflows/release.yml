name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release (all, sdk, openai, gemini)"
        required: true
        default: "all"
      version:
        description: "Version bump (patch, minor, major)"
        required: true
        default: "patch"

jobs:
  check:
    name: Pre-release Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Verify build outputs
        run: |
          for package in packages/*; do
            if [ ! -d "$package/dist" ]; then
              echo "Error: $package/dist directory not found"
              exit 1
            fi
          done

  release:
    name: Release Packages
    runs-on: ubuntu-latest
    needs: check
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Build packages
        run: npm run build

      - name: Display release information
        run: |
          echo "Package to release: ${{ github.event.inputs.package }}"
          echo "Version bump: ${{ github.event.inputs.version }}"

      - name: Create release notes
        run: |
          echo "## Release Notes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Package: ${{ github.event.inputs.package }}" >> RELEASE_NOTES.md
          echo "Version Bump: ${{ github.event.inputs.version }}" >> RELEASE_NOTES.md
          echo "Date: $(date)" >> RELEASE_NOTES.md

      - name: Prepare release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # This is a placeholder for actual release logic
          # In production, you'd want to use changesets or a tool like lerna
          echo "Release preparation complete"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: RELEASE_NOTES.md
          body: |
            Released package: ${{ github.event.inputs.package }}
            Version bump: ${{ github.event.inputs.version }}
          tag_name: release-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify release
        if: success()
        run: |
          echo "✅ Release successful!"
          echo "Package: ${{ github.event.inputs.package }}"
          echo "Bump: ${{ github.event.inputs.version }}"
