name: Publish @fluxgate/gemini

on:
  push:
    branches: [main]
    paths:
      - "packages/gemini/**"
      - "!packages/gemini/**/*.test.ts"
      - "!packages/gemini/examples/**"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck --workspace=packages/gemini
      - run: npm test --workspace=packages/gemini
      - run: npm run build --workspace=packages/gemini

      - name: Publish to npm
        working-directory: packages/gemini
        run: npm publish --provenance --access public
